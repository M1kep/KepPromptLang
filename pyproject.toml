[project]
name = "keppromptlang"
version = "0.2.0"
description = "A small DSL for ComfyUI that lets you do math on CLIP token embeddings before they're fed into the text transformer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "lark",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "torch",
]

[project.urls]
Repository = "https://github.com/M1kep/KepPromptLang"

[tool.comfy]
PublisherId = "m1kep"
DisplayName = "KepPromptLang"

[tool.pytest.ini_options]
testpaths = ["tests"]
